<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画ページ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: system-ui, sans-serif;
    }

    .player-wrap {
      width: 100%;
      max-width: 860px;
      padding: 2rem;
      background: #1a1a1a;
      border-radius: 16px;
      border: 1px solid #2a2a2a;
      margin: 2rem;
    }

    .video-frame {
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16 / 9;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .meta {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 13px;
      color: #888;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .badge {
      font-size: 11px;
      color: #555;
      border: 1px solid #2a2a2a;
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="player-wrap">
    <div class="video-frame">
      <video controls>
        <source src="nano.mp4" type="video/mp4">
        お使いのブラウザは動画再生に対応していません。
      </video>
    </div>
    <div class="meta">
      <span class="title">激写副リーダー真の姿</span>
      <span class="badge">HD</span>
    </div>
  </div>
</body>
</html>
