<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画ページ</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .video-wrapper {
      width: 100%;
      max-width: 900px;
      padding: 16px;
      box-sizing: border-box;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <video controls>
      <source src="nano.mp4" type="video/mp4">
      お使いのブラウザは動画再生に対応していません。
    </video>
  </div>
</body>
</html>
